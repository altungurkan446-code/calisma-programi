<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satış ve Stok Analizi: 8 Haftalık Çalışma Programı</title>
<script>(function(){var t;try{t=localStorage.getItem("ep-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d1c1a; --muted:#6b6862; --line:#e4e1da;
  --accent:#2f5d50; --accent-soft:#e3eee9;
  --excel:#1e7a45; --python:#2b5fa8; --sql:#c0611d; --pbi:#b58900; --port:#6b4fa8; --flex:#8a8780;
  --soft:#fbfaf7; --soft2:#f3f1ec; --codebg:#efede7; --track:#ebe8e1; --body2:#3a3833; --body3:#45423c; --hover:#cfcbc2;
  --done-bg:#e8f3ec; --done-line:#b9dcc6;
  --note-bg:#fff8e6; --note-line:#f0dfb0; --en-bg:#eef3fb; --en-line:#cfdcf0;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#151513; --card:#1f1e1b; --ink:#ecebe6; --muted:#9d9a92; --line:#33312c;
  --accent:#6fb59d; --accent-soft:#233a32;
  --excel:#4cb877; --python:#6c9ce0; --sql:#e48a4a; --pbi:#d8b33a; --port:#a68ae0; --flex:#8f8c84;
  --soft:#25241f; --soft2:#2a2924; --codebg:#2e2c27; --track:#2e2c27; --body2:#d6d4cd; --body3:#c5c2ba; --hover:#4a4740;
  --done-bg:#1f3a2a; --done-line:#2f5c40;
  --note-bg:#352d18; --note-line:#5a4b22; --en-bg:#1c2738; --en-line:#2d4060;
  color-scheme:dark;
}
body,header,.week,.panel,.day,.tcard{transition:background-color .2s,border-color .2s,color .2s}
.theme{width:36px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,sans-serif}
code{font-family:"JetBrains Mono",monospace;font-size:.86em;background:var(--codebg);padding:1px 5px;border-radius:4px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 24px}
.hwrap{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.prog{display:flex;align-items:center;gap:12px;min-width:260px}
.bar{flex:1;height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.ptxt{font-size:13px;color:var(--muted);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--hover)}
.btn.primary{background:var(--accent);color:var(--card);border-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:22px 24px 60px;display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
.side{position:sticky;top:14px}
@media (max-width:860px){.side{position:static}}
.week{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wt{font-weight:600;font-size:14px}
.wd{font-size:12px;color:var(--muted)}
.wtag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;color:#fff;margin-top:4px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.day{border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:5px 0 4px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);position:relative}
.day b{display:block;font-size:13px;font-weight:600}
.day span{display:block;font-size:10px;color:var(--muted)}
.day:hover{border-color:var(--hover)}
.day.sel{outline:2px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
.day.done{background:var(--done-bg);border-color:var(--done-line)}
.day.done::after{content:"✓";position:absolute;top:1px;right:4px;font-size:10px;color:var(--excel);font-weight:700}
.day.today{box-shadow:inset 0 -3px 0 var(--accent)}
.day.flex b{color:var(--flex)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 30px}
@media (max-width:600px){.panel{padding:20px 18px}}
.kick{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.panel h2{font-size:24px;margin:4px 0 6px;letter-spacing:-.015em;line-height:1.25}
.goal{font-size:16px;color:var(--body2);margin:0 0 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.tool{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.tool i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;font-weight:600}
.plan{display:flex;flex-wrap:wrap;gap:6px}
.plan div{background:var(--soft2);border-radius:7px;padding:5px 10px;font-size:13px}
.plan div b{font-weight:600;margin-right:5px}
ol.tasks{margin:0;padding-left:0;list-style:none;counter-reset:t}
ol.tasks li{counter-increment:t;position:relative;padding:8px 0 8px 36px;border-bottom:1px dashed var(--line)}
ol.tasks li:last-child{border-bottom:0}
ol.tasks li::before{content:counter(t);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.note{background:var(--note-bg);border:1px solid var(--note-line);border-radius:10px;padding:10px 14px;font-size:14px}
.en{background:var(--en-bg);border:1px solid var(--en-line);border-radius:10px;padding:10px 14px;font-size:14px}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
.check{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.nav{display:flex;gap:8px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs .btn.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:6px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--soft)}
.tcard h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.tcard h4 i{width:10px;height:10px;border-radius:50%}
.tcard p{margin:4px 0;font-size:13.5px;color:var(--body3)}
.tcard .lbl{font-weight:600;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin:2px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div>
      <h1>Satış ve Stok Analizi Portföy Projesi</h1>
      <div class="sub">8 hafta · günde 90 dakika · Excel → Python → SQL (MySQL) → Power BI</div>
    </div>
    <div class="prog">
      <div class="bar"><i id="pbar"></i></div>
      <div class="ptxt" id="ptxt"></div>
      <button class="btn primary" id="todayBtn">Bugün</button>
      <button class="btn theme" id="themeBtn" title="Karanlık / aydınlık mod" aria-label="Karanlık / aydınlık mod">🌙</button>
    </div>
  </div>
</header>

<main>
  <aside class="side">
    <div class="tabs">
      <button class="btn on" id="tabPlan">Program</button>
      <button class="btn" id="tabTools">Programlar</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--excel)"></i>Excel</span>
      <span><i style="background:var(--python)"></i>Python</span>
      <span><i style="background:var(--sql)"></i>SQL</span>
      <span><i style="background:var(--pbi)"></i>Power BI</span>
      <span><i style="background:var(--port)"></i>Portföy</span>
    </div>
    <div id="weeks"></div>
  </aside>
  <section class="panel" id="panel"></section>
</main>

<script>
const START = new Date(2026, 10, 16); // 16 Kasım 2026, Pazartesi = Gün 1
const DAYN = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
const MON = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];

const TOOLS = {
  excel:  {name:"Excel", c:"var(--excel)", ne:"Veriyi tanıma, temizleme, PivotTable, ABC analizi ve ilk grafikler.", kur:"Microsoft 365 Excel (öğrenci hesabınla ücretsiz olabilir). XLOOKUP için 2021 veya 365 sürümü gerekir.", ipucu:"Veriyi Ctrl+T ile Tablo'ya çevir, formüller kendiliğinden aşağı uzar."},

  python: {name:"Python + Pandas", c:"var(--python)", ne:"Excel'de yaptığın analizi kodla tekrarlamak ve otomatikleştirmek.", kur:"Terminalde: pip install pandas numpy matplotlib openpyxl", ipucu:"Her yeni fonksiyonda önce df.head() ile sonuca bak; ezberleme, gözlemle."},
  mysql:  {name:"MySQL Workbench", c:"var(--sql)", ne:"Veritabanı ve tabloları kurmak, SQL ile analiz yapmak. Sürümün 8.0.46: CTE ve window functions çalışır.", kur:"Kurulu. Veri aktarma: tabloya sağ tık → Table Data Import Wizard.", ipucu:"Sorguyu çalıştırmak için Ctrl+Enter (imlecin olduğu sorgu), Ctrl+Shift+Enter (hepsi)."},
  pbi:    {name:"Power BI Desktop", c:"var(--pbi)", ne:"Model kurmak, DAX ölçüleri yazmak ve yönetici dashboard'u hazırlamak.", kur:"Microsoft Store'dan ücretsiz Power BI Desktop. MySQL'e bağlanmak için MySQL Connector/NET veya ODBC gerekebilir.", ipucu:"Hesaplama sütunu her satır için, ölçü (measure) toplam için. Çoğu zaman ölçü istersin."},
  git:    {name:"Git + GitHub", c:"var(--port)", ne:"Projeyi portföy olarak yayınlamak ve sürüm takibi.", kur:"git-scm.com'dan Git for Windows, github.com'da hesap. VS Code'un Source Control paneli işini kolaylaştırır.", ipucu:"Her çalışma gününün sonunda küçük bir commit at: 'gün 18: merge ve hesaplama sütunları'."},
  linkedin:{name:"LinkedIn", c:"var(--port)", ne:"Profil, proje vitrini ve mezunlara kısa mesajlar.", kur:"Hesabın açık. Fotoğraf, başlık, özet, deneyim (Grammer) ve beceriler eksiksiz olsun.", ipucu:"Başlık örneği: 'Endüstri Mühendisliği Öğrencisi | Veri Analizi · SQL · Python · Power BI'."},
  not:    {name:"Not defteri", c:"var(--flex)", ne:"Bulguların, kararların ve öz değerlendirmen için. Kâğıt, Word ya da OneNote fark etmez.", kur:"Projeye bir 'calisma_gunlugu.md' dosyası açmak da iyi bir seçenek.", ipucu:"Her kararın yanına 'neden' yaz. Mülakatta sorulan tam olarak budur."}
};

const STAGE = {excel:["Excel","var(--excel)"], python:["Python","var(--python)"], sql:["SQL","var(--sql)"], pbi:["Power BI","var(--pbi)"], port:["Portföy","var(--port)"], flex:["Esnek","var(--flex)"]};

const FLEX = (extra)=>({flex:true, t:"Esnek gün: tekrar ve dinlenme", g:"Haftanın eksiklerini kapat, yorulduysan dinlen.", tools:["not"], plan:[["30 dk","Takıldığın görevi tekrar çöz"],["30 dk",extra[0]],["15 dk","Haftalık öz değerlendirme"]], konu:"Esnek gün, programın kaymasını önleyen tamponun. Bir gün kaçırdıysan onu bugün telafi edersin, ayrıca ekstra süre eklemezsin.", tasks:extra.slice(1), teslim:"Haftalık öz değerlendirme: Bu hafta ne öğrendim? Neyi hâlâ açıklayamıyorum?"});

const WEEKS = [
 {title:"Hafta 1", stage:"excel", konu:"Excel: tanıma, temizlik, hesaplama, Pivot, ABC", days:[

   konu:"`sales` bir olay tablosu: her satır bir satış kalemi. `products` ve `customers` ise tanım tabloları. Aralarındaki bağ `product_id` ve `customer_id`. Analizden önce sorulacak ilk soru: \"Bu veriye ne kadar güvenebilirim?\"",
   araclar:"Durum çubuğu (Sayı, Toplam), Filtre, `COUNTBLANK`, `COUNTIF`, Koşullu Biçimlendirme → Yinelenen Değerler.",
   tasks:["`satis_stok_veri_seti.zip` dosyasını aç, dört CSV'yi Excel'de aç. Her dosyanın satır sayısını ve sütun adlarını not defterine yaz.","`sales` içinde `quantity` sütununda kaç boş ve kaç negatif değer var? Hangi yöntemle bulduğunu da yaz.","`order_date` sütununda tutarsız tarih formatı var mı? Kaç satır etkileniyor, nasıl saydın?","`sales` içinde birebir aynı (tekrar eden) satır var mı? Yaklaşık kaç tane?"],
   senaryo:"Müdürün \"geçen yıl cirom neydi?\" diye soruyor. Veriyi temizlemeden toplam alsan sonuç neden yanlış olurdu? 2-3 cümleyle yaz.",

  {t:"Temizlik", g:"`sales` verisini temizlemek ve her kararı bir temizlik defterine yazmak.", tools:["excel","not"],

   teslim:"Temiz sayfa + temizlik defteri (sorun · kaç satır · ne yaptım · neden) + satır sayısı önce/sonra."},
  {t:"Hesaplama sütunları", g:"Ciro, maliyet ve brüt kâr sütunlarını üretip projenin referans rakamlarını bulmak.", tools:["excel"],
   plan:[["0-15","Konu ve örnek"],["15-70","Görevler"],["70-80","İngilizce"],["80-90","Öz değerlendirme"]],
   konu:"`sales` içinde maliyet yok, `products` içinde var. İki tabloyu Excel'de birleştirmenin yolu `XLOOKUP(aranan; aranan_aralık; dönen_aralık)`. Örnek: `product_id`'ye göre ürün adını getirmek. Önce verini Ctrl+T ile Tabloya çevir.",

// ---- yardımcılar
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const ALL = []; WEEKS.forEach((w,wi)=>w.days.forEach((d,di)=>ALL.push({...d, w:wi, di, n:wi*7+di+1})));
const dateOf = n => { const d=new Date(START); d.setDate(d.getDate()+n-1); return d; };
const dstr = d => `${d.getDate()} ${MON[d.getMonth()]}`;
function todayN(){ const t=new Date(); t.setHours(0,0,0,0); return Math.floor((t-START)/86400000)+1; }

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem("ep-done")||"[]")); } catch(e){}
function save(){ try { localStorage.setItem("ep-done", JSON.stringify([...done])); } catch(e){} }

let cur = 1, view = "plan";

function renderSide(){
  const tn = todayN();
  document.getElementById("weeks").innerHTML = WEEKS.map((w,wi)=>{
    const s0 = dateOf(wi*7+1), s1 = dateOf(wi*7+7);
    const [sl, sc] = STAGE[w.stage];
    return `<div class="week"><div class="wh"><span class="wt">${w.title}</span><span class="wd">${dstr(s0)} – ${dstr(s1)}</span></div>
      <div style="font-size:12.5px;color:var(--body3);margin-top:3px">${esc(w.konu)}</div>
      <div class="days">${w.days.map((d,di)=>{const n=wi*7+di+1, dt=dateOf(n);
        const cls=["day", d.flex?"flex":"", n===cur&&view==="plan"?"sel":"", done.has(n)?"done":"", n===tn?"today":""].join(" ");
        return `<button class="${cls}" data-n="${n}" title="Gün ${n}: ${esc(d.t)}"><b>${n}</b><span>${DAYN[dt.getDay()===0?6:dt.getDay()-1]}</span></button>`}).join("")}</div></div>`;
  }).join("");
  document.querySelectorAll(".day").forEach(b=>b.onclick=()=>go(+b.dataset.n));
  const work = ALL.filter(d=>!d.flex).length, dn = ALL.filter(d=>!d.flex && done.has(d.n)).length;
  document.getElementById("pbar").style.width = (dn/work*100)+"%";
  document.getElementById("ptxt").textContent = `${dn}/${work} çalışma günü`;
}

function toolTag(k){ const t=TOOLS[k]; return `<span class="tool" data-tool="${k}"><i style="background:${t.c}"></i>${t.name}</span>`; }

function renderDay(){
  const d = ALL[cur-1], w = WEEKS[d.w], dt = dateOf(cur), [sl, sc] = STAGE[d.flex?"flex":w.stage];
  const tn = todayN(), rel = cur===tn ? " · Bugün" : "";
  const p = document.getElementById("panel");
  p.innerHTML = `
    <div class="kick">${w.title} · Gün ${cur} · ${dstr(dt)} ${DAYN[dt.getDay()===0?6:dt.getDay()-1]}${rel} <span class="wtag" style="background:${sc};margin-left:6px">${sl}</span></div>
    <h2>${fmt(d.t)}</h2>
    <p class="goal">${fmt(d.g)}</p>
    <div class="row"><span style="font-size:12px;font-weight:600;color:var(--muted);margin-right:2px">KULLANACAĞIN PROGRAMLAR</span>${d.tools.map(toolTag).join("")}</div>
    <div class="sec"><h3>90 dakikalık plan</h3><div class="plan">${d.plan.map(x=>`<div><b>${esc(x[0])}${/dk/.test(x[0])?"":" dk"}</b>${fmt(x[1])}</div>`).join("")}</div></div>
    <div class="sec"><h3>Konu</h3><p style="margin:0">${fmt(d.konu)}</p>${d.araclar?`<p style="margin:8px 0 0"><b>Kullanacağın özellikler:</b> ${fmt(d.araclar)}</p>`:""}</div>
    ${d.tasks&&d.tasks.length?`<div class="sec"><h3>Görevler</h3><ol class="tasks">${d.tasks.map(t=>`<li>${fmt(t)}</li>`).join("")}</ol></div>`:""}
    ${d.not?`<div class="sec" style="border:0;padding-top:4px"><div class="note">${fmt(d.not)}</div></div>`:""}
    ${d.senaryo?`<div class="sec"><h3>İşletme senaryosu</h3><p style="margin:0">${fmt(d.senaryo)}</p></div>`:""}
    ${d.en?`<div class="sec"><h3>Teknik İngilizce</h3><div class="en">${fmt(d.en)}</div></div>`:""}
    <div class="sec"><h3>Gün sonu teslimi</h3><p style="margin:0">${fmt(d.teslim)}</p></div>
    <div class="foot">
      <label class="check"><input type="checkbox" id="doneBox" ${done.has(cur)?"checked":""}> Bu günü tamamladım</label>
      <div class="nav"><button class="btn" id="prev" ${cur===1?"disabled":""}>← Önceki</button><button class="btn" id="next" ${cur===ALL.length?"disabled":""}>Sonraki →</button></div>
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin:14px 0 0">Çözümleri kendin bul. Takıldığında Claude'a görevi yaz ve önce ipucu iste. İşaretlerin sadece bu tarayıcıda saklanır.</p>`;
  document.getElementById("doneBox").onchange = e => { e.target.checked?done.add(cur):done.delete(cur); save(); renderSide(); };
  document.getElementById("prev").onclick = ()=>go(cur-1);
  document.getElementById("next").onclick = ()=>go(cur+1);
  p.querySelectorAll(".tool").forEach(t=>t.onclick=()=>showTools(t.dataset.tool));
}

function showTools(focus){
  view="tools"; setTabs(); renderSide();
  const order = ["excel","vscode","python","mysql","pbi","git","linkedin","not"];
  document.getElementById("panel").innerHTML = `
    <div class="kick">Başvuru</div><h2>Kullanacağın programlar</h2>
    <p class="goal">Her aracın bu projedeki rolü, kurulum notu ve küçük bir ipucu.</p>
    <div class="note" style="margin-bottom:14px">Veri akışı: CSV → Excel (keşif, temizlik) → Python/Pandas (otomasyon) → MySQL (sorgu) → Power BI (dashboard). Her aşamada toplam ciro aynı çıkmalı.</div>
    <div class="tgrid">${order.map(k=>{const t=TOOLS[k]; const used=ALL.filter(d=>d.tools.includes(k)).map(d=>d.n);
      return `<div class="tcard" id="t-${k}" style="${k===focus?"outline:2px solid "+t.c:""}"><h4><i style="background:${t.c}"></i>${t.name}</h4>
      <p>${fmt(t.ne)}</p><p><span class="lbl">Kurulum:</span> ${fmt(t.kur)}</p><p><span class="lbl">İpucu:</span> ${fmt(t.ipucu)}</p>
      <p style="color:var(--muted);font-size:12.5px">Kullanılan günler: ${used.length? used.slice(0,1)+"–"+used.slice(-1)+" ("+used.length+" gün)":"-"}</p></div>`}).join("")}</div>`;
  if(focus){ const el=document.getElementById("t-"+focus); el && el.scrollIntoView({block:"nearest"}); }
}

function setTabs(){ document.getElementById("tabPlan").classList.toggle("on",view==="plan"); document.getElementById("tabTools").classList.toggle("on",view==="tools"); }

function go(n){
  n = Math.max(1, Math.min(ALL.length, n)); cur = n; view = "plan";
  try { if(location.hash !== "#gun-"+n) history.replaceState(null,"","#gun-"+n); } catch(e){}
  setTabs(); renderSide(); renderDay();
  if (window.innerWidth < 860) document.getElementById("panel").scrollIntoView({behavior:"smooth"});
}

function fromHash(){
  const m = /^#gun-(\d+)$/.exec(location.hash);
  if (m) return +m[1];
  if (location.hash === "#programlar") return -1;
  const t = todayN(); return t>=1 && t<=ALL.length ? t : 1;
}

function setThemeIcon(){ document.getElementById("themeBtn").textContent = document.documentElement.getAttribute("data-theme")==="dark" ? "☀️" : "🌙"; }
document.getElementById("themeBtn").onclick = ()=>{ const n = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); try{ localStorage.setItem("ep-theme", n); }catch(e){} setThemeIcon(); };
setThemeIcon();
document.getElementById("todayBtn").onclick = ()=>{ const t=todayN(); go(t>=1&&t<=ALL.length?t:1); };
document.getElementById("tabPlan").onclick = ()=>go(cur);
document.getElementById("tabTools").onclick = ()=>showTools();
window.addEventListener("hashchange", ()=>{ const n=fromHash(); if(n===-1) showTools(); else if(n!==cur) go(n); });

const first = fromHash(); if (first===-1) { renderSide(); showTools(); } else go(first);
</script>
</body>
</html>
